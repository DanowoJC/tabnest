<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabNest</title>
  <link rel="icon" href="../../icons/icon32.png">
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><img src="../../icons/icon32.png" width="20" height="20" alt=""><span>TabNest</span></div>
      <label class="search grow">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="text" autocomplete="off" data-i18n-ph="searchPlaceholder">
      </label>
      <button id="btn-settings" class="icon-btn" data-i18n-title="optTitle"></button>
    </header>

    <nav class="nav" id="nav">
      <button data-view="open"><span data-i18n="navOpen"></span><b class="count" id="c-open"></b></button>
      <button data-view="sessions"><span data-i18n="navSessions"></span><b class="count" id="c-sessions"></b></button>
      <button data-view="archive"><span data-i18n="navArchive"></span><b class="count" id="c-archive"></b></button>
      <button data-view="backups"><span data-i18n="navAutosaves"></span></button>
      <button data-view="stats"><span data-i18n="navStats"></span></button>
    </nav>

    <main id="view"></main>
  </div>
  <script type="module" src="manager.js"></script>
</body>
</html>
