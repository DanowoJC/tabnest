<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <label class="search grow">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="text" autocomplete="off" data-i18n-ph="searchPlaceholder">
    </label>
    <button id="btn-manager" class="icon-btn" data-i18n-title="openManager"></button>
    <button id="btn-settings" class="icon-btn" data-i18n-title="optTitle"></button>
  </header>

  <main>
    <div id="results" hidden></div>
    <div id="home">
      <div class="save-row">
        <button id="save-window" class="btn" data-i18n="saveWindow"></button>
        <button id="save-more" class="btn ghost" aria-label="More">⋯</button>
      </div>

      <div class="section-title" data-i18n="quickActions"></div>
      <div class="quick">
        <button id="act-group" class="quick-btn"></button>
        <button id="act-dups" class="quick-btn"></button>
        <button id="act-hibernate" class="quick-btn"></button>
      </div>

      <div class="section-title" data-i18n="recentSessions"></div>
      <div id="recent"></div>
    </div>
  </main>

  <footer class="foot muted small">
    <span id="stats"></span>
    <span class="kbd">Ctrl+Shift+K</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
