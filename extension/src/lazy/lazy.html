<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>…</title>
  <link id="icon" rel="icon" href="../../icons/icon16.png">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px system-ui, sans-serif; background: Canvas; color: CanvasText; cursor: pointer; }
    .box { text-align: center; max-width: 560px; padding: 24px; }

    .hint { opacity: .5; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <img id="fav" alt="">
    <h1 id="title"></h1>
